<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent</title><link rel="stylesheet" href="/style.css?v=3"></head><body>
<div id="login" hidden><form id="lf"><h1>Masuk</h1><input id="lu" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button>Masuk</button><p id="le"></p></form></div>
<div id="app" hidden>
<aside><button id="new">Percakapan baru</button><ul id="convs"></ul><div class="foot"><button id="adm" hidden>Pengaturan admin</button><button id="out">Keluar</button></div></aside>

<section id="chat"></section>

<aside class="files"><h3>Files</h3><ul id="files"></ul><a id="zip" class="btn" hidden>Unduh semua (.zip)</a></aside>
</div>
<dialog id="dlg"><nav><button data-t="personas">Personalisasi</button><button data-t="skills">Skills</button><button data-t="pw">Password</button><button id="cl">Tutup</button></nav><div id="panel"></div></dialog>
<script src="/app.js?v=3"></script></body></html>
